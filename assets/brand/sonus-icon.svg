<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024">
  <title>Sonus</title>
  <!-- Sonus: an aspect-style medallion. A voice waveform closes in on a text cursor: speech becoming text.
       Teal-to-violet disk, faint inner ring, white glyph. Drawn on a 64-unit grid. -->
  <defs>
    <linearGradient id="sonus-disk" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ec2b0"/>
      <stop offset=".5" stop-color="#3f7ee8"/>
      <stop offset="1" stop-color="#8b3ff0"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#sonus-disk)"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.25"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- waveform -->
    <path d="M12 28V36M52 28V36" stroke-width="4"/>
    <path d="M21 22V42M43 22V42" stroke-width="6"/>
    <!-- text cursor -->
    <path d="M32 20V44" stroke-width="4"/>
    <path d="M25 15Q32 15 32 21Q32 15 39 15M25 49Q32 49 32 43Q32 49 39 49" stroke-width="4"/>
  </g>
</svg>
