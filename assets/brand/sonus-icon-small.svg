<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="16" height="16">
  <title>Sonus</title>
  <!-- Sonus mark hinted for 16-24 px (tray, small icon frames): no ring, two waveform bars,
       every edge on the 16 px pixel grid (4 units = 1 px). -->
  <defs>
    <linearGradient id="sonus-disk" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ec2b0"/>
      <stop offset=".5" stop-color="#3f7ee8"/>
      <stop offset="1" stop-color="#8b3ff0"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#sonus-disk)"/>
  <g fill="#fff">
    <rect x="12" y="24" width="8" height="16" rx="2"/>
    <rect x="44" y="24" width="8" height="16" rx="2"/>
    <rect x="28" y="16" width="8" height="32"/>
    <rect x="24" y="12" width="16" height="4"/>
    <rect x="24" y="48" width="16" height="4"/>
  </g>
</svg>
