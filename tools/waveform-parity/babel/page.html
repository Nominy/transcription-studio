<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      /* Babel's lane body: `relative flex-1 overflow-x-auto overflow-y-hidden bg-white`
         holding the wavesurfer container (`w-full`, height = the lane height). */
      #lane {
        position: relative;
        overflow-x: auto;
        overflow-y: hidden;
      }
      #underlay {
        position: absolute;
        inset: 0;
      }
      #wave {
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="lane"><div id="underlay"></div><div id="wave"></div></div>
    <script src="wavesurfer.js"></script>
    <script src="display-signal.js"></script>
    <script src="harness.js"></script>
  </body>
</html>
