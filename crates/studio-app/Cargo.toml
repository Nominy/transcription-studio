[package]
name = "studio-app"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "studio-app"
path = "src/main.rs"

[features]
default = ["batteries-included"]
batteries-included = ["local", "formats", "basic-checks", "gold", "babel"]
local = ["dep:exaudio-local"]
formats = ["dep:exaudio-formats"]
basic-checks = ["dep:exaudio-lint-basic"]
gold = ["dep:exaudio-gold-ui"]
babel = ["dep:exaudio-babel-ui", "dep:exaudio-babel-services", "dep:exaudio-babel-lint", "dep:exaudio-babel-tags"]

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
exaudio-extension.workspace = true
exaudio-shell.workspace = true
studio-services.workspace = true
exaudio-local = { workspace = true, optional = true }
exaudio-formats = { workspace = true, optional = true }
exaudio-lint-basic = { workspace = true, optional = true }
exaudio-gold-ui = { workspace = true, optional = true }
exaudio-babel-ui = { workspace = true, optional = true }
exaudio-babel-services = { workspace = true, optional = true }
exaudio-babel-lint = { workspace = true, optional = true }
exaudio-babel-tags = { workspace = true, optional = true }

[build-dependencies]
embed-resource = "3"
