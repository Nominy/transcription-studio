[package]
name = "studio-app"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "studio-app"
path = "src/main.rs"

[features]
default = ["batteries-included"]
batteries-included = ["local", "formats", "basic-checks", "gold", "babel"]
local = ["dep:sonus-local"]
formats = ["dep:sonus-formats"]
basic-checks = ["dep:sonus-lint-basic"]
gold = ["dep:sonus-gold-ui"]
babel = ["dep:sonus-babel-ui", "dep:sonus-babel-services", "dep:sonus-babel-lint", "dep:sonus-babel-tags"]

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
sonus-extension.workspace = true
sonus-shell.workspace = true
studio-services.workspace = true
sonus-local = { workspace = true, optional = true }
sonus-formats = { workspace = true, optional = true }
sonus-lint-basic = { workspace = true, optional = true }
sonus-gold-ui = { workspace = true, optional = true }
sonus-babel-ui = { workspace = true, optional = true }
sonus-babel-services = { workspace = true, optional = true }
sonus-babel-lint = { workspace = true, optional = true }
sonus-babel-tags = { workspace = true, optional = true }

[build-dependencies]
embed-resource = "3"
