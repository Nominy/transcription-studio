name: Windows Alpha Package

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Velopack channel
        required: true
        default: alpha
        type: choice
        options:
          - alpha
      version:
        description: Optional version assertion. If set, it must match crates/studio-app/Cargo.toml.
        required: false
        type: string
      feed_url:
        description: Existing Velopack feed URL used to prime delta packages.
        required: true
        default: https://reviewgen.ovh/transcription-studio/alpha/win-x64
        type: string
      publish_to_vps:
        description: Publish artifacts to the VPS feed after packaging.
        required: true
        default: false
        type: boolean
      remote_path:
        description: Remote web-root path for the Velopack feed.
        required: true
        default: /var/www/transcription-studio/alpha/win-x64
        type: string

permissions:
  contents: read

concurrency:
  group: velopack-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Windows alpha
    runs-on: windows-latest

    env:
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
      FEED_URL: ${{ inputs.feed_url }}
      REMOTE_PATH: ${{ inputs.remote_path }}
      STUDIO_BUILD_GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: alpha-win-x64
          cache-on-failure: true

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore pinned Velopack CLI
        run: dotnet tool restore

      - name: Prime existing Velopack packages for deltas
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $PWD "target\velopack\Releases"
          if (Test-Path -LiteralPath $releaseDir) {
            Remove-Item -LiteralPath $releaseDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          & dotnet tool run vpk -- download http `
            --url $env:FEED_URL `
            --channel $env:CHANNEL `
            --outputDir $releaseDir
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not download the latest Velopack release; packaging will create full artifacts only."
            exit 0
          }

      - name: Build Velopack artifacts
        shell: pwsh
        run: |
          $packageArgs = @{
            Channel = $env:CHANNEL
          }
          if (-not [string]::IsNullOrWhiteSpace($env:VERSION)) {
            $packageArgs.Version = $env:VERSION
          }
          & .\tools\package-alpha-windows.ps1 @packageArgs

      - name: Publish artifacts to VPS
        if: ${{ inputs.publish_to_vps }}
        shell: pwsh
        env:
          ALPHA_SSH_HOST: ${{ secrets.ALPHA_SSH_HOST }}
          ALPHA_SSH_USER: ${{ secrets.ALPHA_SSH_USER }}
          ALPHA_SSH_PRIVATE_KEY: ${{ secrets.ALPHA_SSH_PRIVATE_KEY }}
          ALPHA_SSH_PORT: ${{ secrets.ALPHA_SSH_PORT }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("ALPHA_SSH_HOST", "ALPHA_SSH_USER", "ALPHA_SSH_PRIVATE_KEY")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name secret is required when publish_to_vps is true."
            }
          }

          $port = if ([string]::IsNullOrWhiteSpace($env:ALPHA_SSH_PORT)) { 22 } else { [int]$env:ALPHA_SSH_PORT }
          $keyPath = Join-Path $env:RUNNER_TEMP "transcription_studio_alpha_deploy_key"
          $keyText = $env:ALPHA_SSH_PRIVATE_KEY -replace "`r`n", "`n"
          [System.IO.File]::WriteAllText($keyPath, $keyText)
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):R" | Out-Null

          $publishArgs = @{
            Channel = $env:CHANNEL
            Remote = "$($env:ALPHA_SSH_USER)@$($env:ALPHA_SSH_HOST)"
            RemotePath = $env:REMOTE_PATH
            PublishDir = (Join-Path $PWD "target\velopack\Publish")
            SshKeyPath = $keyPath
            SshPort = $port
            SkipPackage = $true
          }
          & .\tools\publish-alpha-windows.ps1 @publishArgs
      - name: Upload Velopack publish payload
        uses: actions/upload-artifact@v5
        with:
          name: transcription-studio-${{ inputs.channel }}-windows
          path: target/velopack/Publish/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
