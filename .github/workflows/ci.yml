name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  secrets:
    name: Secret scan
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan the tree and git history with gitleaks
        shell: pwsh
        run: ./tools/scan-secrets.ps1

  check:
    name: Format, lint and test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test all workspace targets
        run: cargo nextest run --workspace --all-targets --locked
