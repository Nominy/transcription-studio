name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Secret scan, lint, and test (self-hosted VPS)
    runs-on: [self-hosted, Linux, vps]

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUST_TEST_THREADS: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan git history
        run: gitleaks detect --source . --redact --verbose

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test all workspace targets
        run: cargo test --workspace --all-targets --locked

      - name: Test native Babel authentication
        run: node --test tools/babel-native-auth.test.mjs
