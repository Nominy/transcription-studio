[package]
name = "exaudio-gold"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
studio-core.workspace = true
studio-editor.workspace = true
studio-waveform.workspace = true
multer = "3"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
base64.workspace = true
bytes.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
studio-services.workspace = true
studio-inference.workspace = true
futures-util = { version = "0.3", default-features = false }
rand.workspace = true
url.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio.workspace = true
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true, features = ["net", "time"] }
